        keywords: ["\u30e1\u30fc\u30eb", "\u3081\u30fc\u308b", "mail", "Mail", "Outlook", "outlook", "icloud", "iCloud", "onmicrosoft", "takase291101.onmicrosoft.com", "\u9001\u308c\u306a\u3044", "\u9001\u4fe1", "\u30a2\u30c9\u30ec\u30b9"],
        title: "\u30e1\u30fc\u30eb",
        answer: "\u30e1\u30fc\u30eb\u95a2\u9023\u306e\u5bfe\u51e6\u65b9\u6cd5\u306f\u3053\u3061\u3089",
        links: [
          {
            label: "@takase291101.onmicrosoft.com\u3067\u30e1\u30fc\u30eb\u304c\u9001\u308c\u306a\u3044",
            url: "https://apricot-math-ece.notion.site/takase291101-onmicrosoft-com-33d4cc0f8ffd809980b7c1a683f5a33b"
          },
          {
            label: "Outlook\u304b\u3089\uff20icloud\u306e\u30a2\u30c9\u30ec\u30b9\u306b\u30e1\u30fc\u30eb\u304c\u9001\u308c\u306a\u3044",
            url: "https://apricot-math-ece.notion.site/outlook-icloud-33d4cc0f8ffd80c8a939c39bc9eef515"
          }
        ]
      }
    ];

    const keywordInput = document.getElementById("keyword");
    const searchButton = document.getElementById("searchButton");
    const result = document.getElementById("result");

    function normalizeText(text) {
      return text.trim().toLowerCase();
    }

    function showMessage(title, message) {
      result.innerHTML = `
        <p class="result-title">${title}</p>
        <p class="result-text">${message}</p>
      `;
    }

    function createLinkHtml(link) {
      return `<a class="result-link" href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`;
    }

    function calculateMatchScore(item, keyword) {
      const title = normalizeText(item.title);
      const answer = normalizeText(item.answer);
      const keywords = item.keywords.map(normalizeText);
      const linkLabels = item.links.map((link) => normalizeText(link.label));
      let score = 0;

      if (title === keyword) {
        score += 120;
      } else if (title.includes(keyword) || keyword.includes(title)) {
        score += 70;
      }

      keywords.forEach((itemKeyword) => {
        if (itemKeyword === keyword) {
          score += 100;
        } else if (itemKeyword.startsWith(keyword) || keyword.startsWith(itemKeyword)) {
          score += 80;
        } else if (itemKeyword.includes(keyword) || keyword.includes(itemKeyword)) {
          score += 55;
        }
      });

      linkLabels.forEach((label) => {
        if (label.includes(keyword)) {
          score += 25;
        }
      });

      if (answer.includes(keyword)) {
        score += 10;
      }

      return score;
    }

    function searchFaq() {
      const keyword = normalizeText(keywordInput.value);

      if (!keyword) {
        showMessage("\u691c\u7d22\u7d50\u679c", "\u691c\u7d22\u3057\u305f\u3044\u30ad\u30fc\u30ef\u30fc\u30c9\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u3002");
        return;
      }

      const matchedFaq = faqData
        .map((item) => ({
          item,
          score: calculateMatchScore(item, keyword)
        }))
        .filter((match) => match.score > 0)
        .sort((a, b) => b.score - a.score)[0]?.item;

      if (!matchedFaq) {
        result.innerHTML = `
          <p class="result-title">\u60c5\u5831\u8ab2\u76f8\u8ac7\u7a93\u53e3\u3078\u3054\u76f8\u8ac7\u304f\u3060\u3055\u3044</p>
          <p class="result-text">Q&A\u306b\u898b\u3064\u304b\u3089\u306a\u3044\u5185\u5bb9\u3067\u3059\u3002\u4e0b\u306e\u30ea\u30f3\u30af\u304b\u3089\u60c5\u5831\u8ab2\u3078\u304a\u554f\u3044\u5408\u308f\u305b\u304f\u3060\u3055\u3044\u3002</p>
          ${createLinkHtml(consultationLink)}
        `;
        return;
      }

      const linkHtml = matchedFaq.links.map(createLinkHtml).join("");

      result.innerHTML = `
        <p class="result-title">${matchedFaq.title}</p>
        <p class="result-text">${matchedFaq.answer}</p>
        ${linkHtml}
      `;
    }

    searchButton.addEventListener("click", searchFaq);
    keywordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        searchFaq();
      }
    });
  </script>
</body>
